[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesturelink"
version = "0.1.0"
description = "Hand-gesture control for an Arduino: MediaPipe landmarks, a PyTorch classifier, serial commands"
readme = "README.md"
license = "MIT"
authors = [{ name = "Huy Pham" }]
requires-python = ">=3.11"
dependencies = [
  "mediapipe>=1.2",
  "opencv-python>=4.10",
  "numpy>=2.0",
  "torch>=2.4",
  "pyserial>=3.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7"]

[project.scripts]
gesturelink = "gesturelink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["camera: needs a real webcam", "board: needs the Arduino plugged in"]
