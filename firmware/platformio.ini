; Arduino Uno firmware for GestureLink.
; Build + upload: pio run -t upload   (serial monitor: pio device monitor)
;
; Default wiring (override any pin with -DPIN_xxx=n in build_flags, see src/config.h):
;   servo signal  D9
;   LEDs 0..3     D2, D3, D8, D10   (220 ohm resistor each, to GND)
;   LCD 16x2      RS D12, EN D11, D4..D7 -> D7, D6, D5, D4  (RW to GND)

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Servo@^1.2.2
    arduino-libraries/LiquidCrystal@^1.0.7
; warnings for our sources only, the Arduino core itself isn't -Wextra clean
build_src_flags = -Wall -Wextra
; example pin override:
; build_flags = -DPIN_SERVO=6
